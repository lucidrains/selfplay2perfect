# Play2Perfect simulation library.
#
# Every tunable number and every MJCF template lives in this file.
# `play` is the base config; `pick` is a sparse override merged over it at load time.
# Templates use $name placeholders (string.Template).
#
play:
  name: play
  assets:
    root: assets/play2perfect
    cache: .cache/play2perfect
    registry:
      robot:
        path: robot/iiwa14_left_sharpa_adjusted_restricted.urdf
        kind: urdf
        prefix: r_
      table:
        path: table/table_narrow.urdf
        kind: urdf
        prefix: t_
      pipette_raw:
        path: tools/pipette_raw.obj
        kind: mesh
      pipette_body:
        path: tools/pipette_body.obj
        kind: mesh
      pipette_tube:
        path: tools/pipette_tube.obj
        kind: mesh
      beam0:
        path: beam/0/beam_3x_0_matchedmass.urdf
        kind: urdf
        prefix: b0_
      beam2:
        path: beam/2/beam_3x_2_matchedmass.urdf
        kind: urdf
        prefix: b2_
      beam6:
        path: beam/6/beam_3x_6_matchedmass.urdf
        kind: urdf
        prefix: b6_
  environment:
    start_modes:
    - table
    - paper
    defaults:
      nworld: 1
      seed: 0
      start_mode: table
      nconmax: 256
      njmax: 512
      resolution:
      - 480
      - 360
      verbose: true
  simulation:
    physics_hz: 120.0
    policy_hz: 60.0
    integrator: implicit
    cone: elliptic
    solver: Newton
    iterations: 20
    tolerance: 1.0e-08
    impratio: 10
    qvel_clamp: 60.0
    default_geom:
      solref:
      - 0.006
      - 1.0
      solimp:
      - 0.95
      - 0.99
      - 0.001
      friction:
      - 0.5
      - 0.005
      - 0.0001
  collision:
    groups:
      robot: 1
      object: 2
      world: 8
  geometry:
    cylinder_quat: 0.7071068 0 -0.7071068 0
    cylinder_quat_y: 0.7071068 0.7071068 0 0
    identity_quat: 1 0 0 0
  robot:
