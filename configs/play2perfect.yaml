# MJCF templates. $name placeholders are filled by render(template, **values).
templates:
  base.xml: |
    <mujoco model="$model">
      <compiler angle="radian" autolimits="true"/>
      <option timestep="$timestep" integrator="$integrator" cone="$cone"
              solver="$solver" iterations="$iterations" tolerance="$tolerance" impratio="$impratio"/>
      <default>
        <geom solref="$solref" solimp="$solimp" friction="$default_friction"/>
      </default>
      <asset>
    $assets
      </asset>
      <worldbody>
    $entities
      </worldbody>
      <actuator>$actuators</actuator>
    </mujoco>
  camera.xml: |
    <camera name="$name" pos="$pos" quat="$quat" fovy="$fovy"/>
  floor.xml: |
    <geom name="floor" type="plane" size="3 3 0.1" material="floor"/>
  lights.xml: |
    <light name="key" pos="1.1 -1.0 2.0" dir="-0.42 0.42 -1" diffuse="1.05 1.03 1.0"
           specular="0.35 0.35 0.35" castshadow="true" ambient="0.10 0.10 0.12"/>
    <light name="fill" pos="-1.4 -1.2 1.4" dir="0.5 0.5 -0.7" diffuse="0.45 0.47 0.55"
           specular="0.08 0.08 0.08" castshadow="false" ambient="0.07 0.07 0.09"/>
    <light name="rim" pos="0.2 1.6 1.1" dir="0.0 -0.9 -0.6" diffuse="0.35 0.35 0.40"
           castshadow="false" ambient="0.04 0.04 0.05"/>
  pick_ghost_capsule.xml: |
    <geom name="ghost_0" type="capsule" size="$radius $half_length" quat="$quat" rgba="$rgba" contype="0" conaffinity="0" group="2"/>
  pick_ghost_mesh.xml: |
    <geom name="ghost_$index" type="mesh" mesh="$mesh" size="$scale" rgba="$rgba" contype="0" conaffinity="0" group="2"/>
  pick_goal.xml: |
    <body name="goal" pos="$pos" gravcomp="$gravcomp">
      <freejoint name="goal_free"/>$ghost</body>
  pick_shelf.xml: |
    <body name="shelf" pos="$pos">
      <geom name="shelf_top" type="box" size="$half" rgba="$rgba" friction="$friction"/>
      $posts
    </body>
  pick_shelf_post.xml: |
    <geom name="shelf_post_$index" type="box" size="$half" pos="$pos" rgba="$rgba"/>
  play_actuator.xml: |
    <position name="act_$name" joint="$joint" kp="$kp" kv="$kv"/>
  play_assets.xml: |
    <texture type="skybox" builtin="gradient" rgb1="0.34 0.42 0.55" rgb2="0.05 0.06 0.09" width="96" height="384"/>
    <texture name="grid" type="2d" builtin="checker" width="96" height="96" rgb1="0.30 0.31 0.34" rgb2="0.20 0.21 0.24"/>
    <material name="floor" texture="grid" texrepeat="14 14" reflectance="0.04"/>
    <material name="ghost_near" rgba="$ghost_near"/>
    <material name="ghost_far" rgba="$ghost_far"/>
  play_goal.xml: |
    <body name="goal" pos="0 0 $z">$parts</body>
  play_keypoint.xml: |
    <geom name="ghost_kp_$index" type="sphere" size="$radius" pos="$pos" material="$material" contype="0" conaffinity="0" group="2"/>
  play_keypoint_edge.xml: |
    <geom name="ghost_edge_$index" type="capsule" size="$radius $half_length" pos="$pos" quat="$quat" material="$material" contype="0" conaffinity="0" group="2"/>
  play_mesh_asset.xml: |
    <mesh name="$name" file="$file"/>
  play_object.xml: |
    <body name="object" pos="0 0 $z">
      <freejoint name="object_free"/>
      $visual
      $collision
      $meshes
      $proxies
    </body>
  play_robot.xml: |
    <body name="robot" pos="$base_pos">$bodies</body>
  play_table.xml: |
    <body name="table" pos="0 0 $z">
      <geom name="table_top" type="box" size="$half_size" rgba="$rgba" friction="$friction"/>
    </body>
  play_tool_collision.xml: |
    <geom name="handle_box_phys" type="box" size="$handle_box" group="3"/>
    <geom name="handle_cyl_phys" type="cylinder" size="$handle_cyl" quat="$cylinder_quat" group="3"/>
    <geom name="head_box_phys" type="box" size="$head_box" pos="$head_pos 0 0" group="3"/>
    <geom name="head_cyl_phys" type="cylinder" size="$head_cyl" quat="$cylinder_quat" pos="$head_cyl_pos 0 0" group="3"/>
    <geom name="bulb_cyl_phys" type="cylinder" size="$bulb_cyl" quat="$cylinder_quat" pos="$bulb_pos 0 0" group="3"/>
  play_tool_mesh.xml: |
    <geom name="mesh${index}_vis" type="mesh" mesh="$name" size="$scale" rgba="$rgba" contype="0" conaffinity="0" group="2"/>
  play_tool_proxy.xml: |
    <geom name="proxy${index}_phys" type="cylinder" size="$radius $half_length" quat="$cylinder_quat" pos="$pos 0 0" group="3"/>
  play_tool_visual.xml: |
    <geom name="handle_box_vis" type="box" size="$handle_box" rgba="$handle_rgba" contype="0" conaffinity="0" group="2"/>
    <geom name="handle_cyl_vis" type="cylinder" size="$handle_cyl" quat="$cylinder_quat" rgba="$handle_rgba" contype="0" conaffinity="0" group="2"/>
    <geom name="head_box_vis" type="box" size="$head_box" pos="$head_pos 0 0" rgba="$head_rgba" contype="0" conaffinity="0" group="2"/>
    <geom name="head_cyl_vis" type="cylinder" size="$head_cyl" quat="$cylinder_quat" pos="$head_cyl_pos 0 0" rgba="$head_rgba" contype="0" conaffinity="0" group="2"/>
    <geom name="bulb_cyl_vis" type="cylinder" size="$bulb_cyl" quat="$cylinder_quat" pos="$bulb_pos 0 0" rgba="$bulb_rgba" contype="0" conaffinity="0" group="2"/>
